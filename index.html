<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Tigers Computers - Mock Examination Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #64748b;
    }

    .danger {
      background: #b91c1c;
    }

    .hidden {
      display: none;
    }

    .subject-list {
      display: grid;
      gap: 10px;
    }

    .subject-btn {
      margin-top: 0;
      background: #e2e8f0;
      color: #0f172a;
      text-align: left;
    }

    .subject-btn:hover {
      background: #cbd5e1;
    }

    .exam-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .timer {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    .progress {
      height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #0f172a;
      transition: width 0.3s;
    }

    .question {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
    }

    .option {
      display: block;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
    }

    .option:hover {
      background: #f8fafc;
    }

    .option input {
      width: auto;
      margin-right: 10px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 40px;
      font-weight: bold;
      margin: 15px 0;
    }

    .pass {
      color: green;
      font-weight: bold;
      font-size: 22px;
    }

    .fail {
      color: #b91c1c;
      font-weight: bold;
      font-size: 22px;
    }

    .code-hint {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin: 25px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>WAR TIGERS COMPUTERS</h1>
    <p>Mock Examination Portal</p>
  </header>

  <div class="container">

    <!-- LOGIN -->
    <div id="loginScreen" class="card">
      <h2>Candidate Login</h2>

      <label for="candidateName">Candidate Name</label>
      <input
        type="text"
        id="candidateName"
        placeholder="Enter your full name"
      >

      <button onclick="continueToSubjects()">CONTINUE</button>
    </div>


    <!-- SUBJECT SELECTION -->
    <div id="subjectScreen" class="card hidden">
      <h2>Select Subject</h2>

      <p>
        Candidate:
        <strong id="displayCandidate"></strong>
      </p>

      <div class="subject-list">

        <button class="subject-btn" onclick="selectSubject('English Language')">
          English Language
        </button>

        <button class="subject-btn" onclick="selectSubject('Mathematics')">
          Mathematics
        </button>

        <button class="subject-btn" onclick="selectSubject('Government')">
          Government
        </button>

        <button class="subject-btn" onclick="selectSubject('General Knowledge')">
          General Knowledge
        </button>

        <button class="subject-btn" onclick="selectSubject('Current Affairs')">
          Current Affairs
        </button>

        <button class="subject-btn" onclick="selectSubject('Biology')">
          Biology
        </button>

        <button class="subject-btn" onclick="selectSubject('Chemistry')">
          Chemistry
        </button>

        <button class="subject-btn" onclick="selectSubject('Physics')">
          Physics
        </button>

        <button class="subject-btn" onclick="selectSubject('Economics')">
          Economics
        </button>

        <button class="subject-btn" onclick="selectSubject('Geography')">
          Geography
        </button>

      </div>
    </div>


    <!-- CODE SCREEN -->
    <div id="codeScreen" class="card hidden">
      <h2>Subject Access</h2>

      <p>
        Candidate:
        <strong id="codeCandidate"></strong>
      </p>

      <p>
        Subject:
        <strong id="selectedSubject"></strong>
      </p>

      <label for="examCode">Enter Subject Code</label>

      <input
        type="text"
        id="examCode"
        placeholder="Enter access code"
      >

      <button onclick="startExam()">START EXAM</button>

      <button class="secondary" onclick="backToSubjects()">
        BACK TO SUBJECTS
      </button>

      <div class="code-hint">
        Demo codes are currently enabled for testing.
      </div>
    </div>


    <!-- EXAM SCREEN -->
    <div id="examScreen" class="card hidden">

      <div class="exam-top">
        <strong id="examSubject"></strong>
        <div class="timer">
          Time: <span id="timer">30:00</span>
        </div>
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="questionNumber"></p>

      <div id="questionText" class="question"></div>

      <div id="options"></div>

      <div class="nav-buttons">

        <button
          id="previousBtn"
          class="secondary"
          onclick="previousQuestion()"
        >
          PREVIOUS
        </button>

        <button
          id="nextBtn"
          onclick="nextQuestion()"
        >
          NEXT
        </button>

      </div>

      <button
        id="submitBtn"
        class="danger hidden"
        onclick="submitExam()"
      >
        SUBMIT EXAM
      </button>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="card hidden result">

      <h2>Examination Result</h2>

      <p id="resultCandidate"></p>

      <p id="resultSubject"></p>

      <div id="score" class="score"></div>

      <p id="percentage"></p>

      <p id="status"></p>

      <button onclick="restartExam()">
        RETURN TO LOGIN
      </button>

    </div>

  </div>


  <footer>
    © 2026 War Tigers Computers
  </footer>


  <!-- JAVASCRIPT STARTS HERE -->
  <script>

    let candidateName = "";
    let selectedSubject = "";
    let currentQuestion = 0;
    let currentQuestions = [];
    let answers = [];
    let timeLeft = 30 * 60;
    let timerInterval = null;


    /* SUBJECT CODES */

    const subjectCodes = {

      "English Language": "ENG2026",

      "Mathematics": "MATH2026",

      "Government": "GOV2026",

      "General Knowledge": "GK2026",

      "Current Affairs": "CA2026",

      "Biology": "BIO2026",

      "Chemistry": "CHEM2026",

      "Physics": "PHY2026",

      "Economics": "ECO2026",

      "Geography": "GEO2026"

    };


    /* SAMPLE QUESTIONS
       These are original sample questions for testing.
    */

    const questions = [

      {
        subject: "English Language",
        question: "Choose the word closest in meaning to 'rapid'.",
        options: ["Slow", "Fast", "Weak", "Late"],
        answer: 1
      },

      {
        subject: "English Language",
        question: "Which of these is a noun?",
        options: ["Quickly", "Beautiful", "Teacher", "Run"],
        answer: 2
      },


      {
        subject: "Mathematics",
        question: "What is 12 × 5?",
        options: ["50", "55", "60", "65"],
        answer: 2
      },

      {
        subject: "Mathematics",
        question: "What is 100 ÷ 4?",
        options: ["20", "25", "30", "40"],
        answer: 1
      },


      {
        subject: "Government",
        question: "Nigeria operates which system of government?",
        options: [
          "Federal system",
          "Monarchy",
          "Absolute dictatorship",
          "Theocracy"
        ],
        answer: 0
      },


      {
        subject: "General Knowledge",
        question: "What is the capital of Nigeria?",
        options: [
          "Lagos",
          "Kano",
          "Abuja",
          "Ibadan"
        ],
        answer: 2
      },


      {
        subject: "Current Affairs",
        question: "Which institution is responsible for the admission of cadets into the Nigerian Defence Academy?",
        options: [
          "Nigerian Defence Academy",
          "Federal Road Safety Corps",
          "Nigerian Ports Authority",
          "National Assembly"
        ],
        answer: 0
      },


      {
        subject: "Biology",
        question: "Which organ pumps blood around the human body?",
        options: [
          "Liver",
          "Heart",
          "Kidney",
          "Lung"
        ],
        answer: 1
      },


      {
        subject: "Chemistry",
        question: "What is the chemical symbol for oxygen?",
        options: [
          "Ox",
          "O",
          "C",
          "Og"
        ],
        answer: 1
      },


      {
        subject: "Physics",
        question: "Which force pulls objects toward the Earth?",
        options: [
          "Friction",
          "Magnetism",
          "Gravity",
          "Tension"
        ],
        answer: 2
      },


      {
        subject: "Economics",
        question: "What basic economic problem arises because resources are limited?",
        options: [
          "Scarcity",
          "Inflation",
          "Export",
          "Taxation"
        ],
        answer: 0
      },


      {
        subject: "Geography",
        question: "Which is the largest continent?",
        options: [
          "Africa",
          "Europe",
          "Asia",
          "Australia"
        ],
        answer: 2
      }

    ];


    /* LOGIN */

    function continueToSubjects() {

      const nameInput =
        document.getElementById("candidateName").value.trim();

      if (nameInput === "") {

        alert("Please enter the candidate name.");

        return;
      }

      candidateName = nameInput;

      document.getElementById("displayCandidate").textContent =
        candidateName;

      document.getElementById("loginScreen").classList.add("hidden");

      document.getElementById("subjectScreen").classList.remove("hidden");

    }


    /* SELECT SUBJECT */

    function selectSubject(subject) {

      selectedSubject = subject;

      document.getElementById("codeCandidate").textContent =
        candidateName;

      document.getElementById("selectedSubject").textContent =
        selectedSubject;

      document.getElementById("subjectScreen").classList.add("hidden");

      document.getElementById("codeScreen").classList.remove("hidden");

      document.getElementById("examCode").value = "";

    }


    /* BACK TO SUBJECTS */

    function backToSubjects() {

      document.getElementById("codeScreen").classList.add("hidden");

      document.getElementById("subjectScreen").classList.remove("hidden");

    }


    /* START EXAM */

    function startExam() {

      const code =
        document.getElementById("examCode").value.trim().toUpperCase();

      const correctCode =
        subjectCodes[selectedSubject];

      if (code !== correctCode) {

        alert("Incorrect subject code. Please check the code and try again.");

        return;
      }


      currentQuestions =
        questions.filter(function(q) {

          return q.subject === selectedSubject;

        });


      if (currentQuestions.length === 0) {

        alert("Questions for this subject have not been added yet.");

        return;
      }


      currentQuestion = 0;

      answers = new Array(currentQuestions.length).fill(null);

      timeLeft = 30 * 60;


      document.getElementById("codeScreen").classList.add("hidden");

      document.getElementById("examScreen").classList.remove("hidden");

      document.getElementById("examSubject").textContent =
        selectedSubject;


      showQuestion();

      startTimer();

    }


    /* DISPLAY QUESTION */

    function showQuestion() {

      const q = currentQuestions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        currentQuestions.length;


      document.getElementById("questionText").textContent =
        q.question;


      const optionsDiv =
        document.getElementById("options");

      optionsDiv.innerHTML = "";


      q.options.forEach(function(option, index) {

        const label =
          document.createElement("label");

        label.className = "option";


        const radio =
          document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.value = index;

        radio.checked =
          answers[currentQuestion] === index;


        radio.addEventListener("change", function() {

          answers[currentQuestion] = index;

        });


        label.appendChild(radio);

        label.appendChild(
          document.createTextNode(" " + option)
        );

        optionsDiv.appendChild(label);

      });


      document.getElementById("previousBtn").disabled =
        currentQuestion === 0;


      if (currentQuestion === currentQuestions.length - 1) {

        document.getElementById("nextBtn").classList.add("hidden");

        document.getElementById("submitBtn").classList.remove("hidden");

      } else {

        document.getElementById("nextBtn").classList.remove("hidden");

        document.getElementById("submitBtn").classList.add("hidden");

      }


      const progress =
        ((currentQuestion + 1) /
        currentQuestions.length) * 100;


      document.getElementById("progressBar").style.width =
        progress + "%";

    }


    /* NEXT QUESTION */

    function nextQuestion() {

      if (currentQuestion < currentQuestions.length - 1) {

        currentQuestion++;

        showQuestion();

      }

    }


    /* PREVIOUS QUESTION */

    function previousQuestion() {

      if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

      }

    }


    /* TIMER */

    function startTimer() {

      clearInterval(timerInterval);

      updateTimer();


      timerInterval = setInterval(function() {

        timeLeft--;

        updateTimer();


        if (timeLeft <= 0) {

          clearInterval(timerInterval);

          alert("Time is up. Your exam will be submitted automatically.");

          submitExam();

        }

      }, 1000);

    }


    function updateTimer() {

      const minutes =
        Math.floor(timeLeft / 60);

      const seconds =
        timeLeft % 60;


      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    }


    /* SUBMIT EXAM */

    function submitExam() {

      clearInterval(timerInterval);


      let score = 0;


      currentQuestions.forEach(function(q, index) {

        if (answers[index] === q.answer) {

          score++;

        }

      });


      const percentage =
        Math.round(
          (score / currentQuestions.length) * 100
        );


      let status = "";

      if (percentage >= 50) {

        status = "PASS";

      } else {

        status = "FAIL";

      }


      document.getElementById("examScreen").classList.add("hidden");

      document.getElementById("resultScreen").classList.remove("hidden");


      document.getElementById("resultCandidate").textContent =
        "Candidate: " + candidateName;


      document.getElementById("resultSubject").textContent =
        "Subject: " + selectedSubject;


      document.getElementById("score").textContent =
        score + " / " + currentQuestions.length;


      document.getElementById("percentage").textContent =
        "Percentage: " + percentage + "%";


      const statusElement =
        document.getElementById("status");


      statusElement.textContent =
        status;


      statusElement.className =
        percentage >= 50 ? "pass" : "fail";

    }


    /* RESTART */

    function restartExam() {

      clearInterval(timerInterval);

      candidateName = "";

      selectedSubject = "";

      currentQuestion = 0;

      currentQuestions = [];

      answers = [];


      document.getElementById("resultScreen").classList.add("hidden");

      document.getElementById("subjectScreen").classList.add("hidden");

      document.getElementById("codeScreen").classList.add("hidden");

      document.getElementById("examScreen").classList.add("hidden");

      document.getElementById("loginScreen").classList.remove("hidden");

      document.getElementById("candidateName").value = "";

    }

  </script>
  <!-- JAVASCRIPT ENDS HERE -->

</body>
</html>
